<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 260" width="240" height="260">
  <!-- Drip, the Daily360 water mascot. Original artwork. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#7cc8f2"/>
      <stop offset="1" stop-color="#2e86c1"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#dff0fb" stop-opacity=".9"/>
    </linearGradient>
  </defs>
  <style>
    .bob { animation: bob 2.4s ease-in-out infinite; transform-origin: 120px 230px; }
    .shadow { animation: shadow 2.4s ease-in-out infinite; transform-origin: 120px 246px; }
    .eye { animation: blink 4.2s infinite; transform-box: fill-box; transform-origin: center; }
    .wave { animation: wave 1.2s ease-in-out infinite; transform-origin: 192px 160px; }
    .bubble { animation: rise 3s ease-in infinite; opacity: 0; }
    .b2 { animation-delay: 1s; } .b3 { animation-delay: 2s; }
    @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-9px) } }
    @keyframes shadow { 0%,100% { transform: scaleX(1); opacity: .22 } 50% { transform: scaleX(.82); opacity: .14 } }
    @keyframes blink { 0%,44%,48%,100% { transform: scaleY(1) } 46% { transform: scaleY(.1) } }
    @keyframes wave { 0%,100% { transform: rotate(-8deg) } 50% { transform: rotate(22deg) } }
    @keyframes rise { 0% { transform: translateY(0); opacity: 0 } 15% { opacity: .8 } 100% { transform: translateY(-70px); opacity: 0 } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } .bubble { opacity: .6 } }
  </style>

  <ellipse class="shadow" cx="120" cy="246" rx="62" ry="9" fill="#141b3d" opacity=".2"/>

  <g class="bob">
    <!-- waving arm (behind body) -->
    <g class="wave">
      <path d="M190 160 C 208 140, 214 120, 212 104" stroke="#2e86c1" stroke-width="12" stroke-linecap="round" fill="none"/>
      <circle cx="212" cy="98" r="11" fill="#5bb4ec"/>
    </g>

    <!-- body -->
    <path d="M120 22 C 146 66, 198 110, 198 162 A 78 78 0 0 1 42 162 C 42 110, 94 66, 120 22 Z" fill="url(#body)"/>
    <path d="M86 112 C 76 128, 70 146, 72 164" stroke="#fff" stroke-opacity=".55" stroke-width="9" stroke-linecap="round" fill="none"/>
    <circle cx="94" cy="96" r="5" fill="#fff" opacity=".7"/>

    <!-- face -->
    <g class="eye"><ellipse cx="98" cy="156" rx="8.5" ry="11" fill="#141b3d"/><circle cx="101" cy="151" r="3" fill="#fff"/></g>
    <g class="eye"><ellipse cx="142" cy="156" rx="8.5" ry="11" fill="#141b3d"/><circle cx="145" cy="151" r="3" fill="#fff"/></g>
    <ellipse cx="82" cy="178" rx="10" ry="6" fill="#ff8fa3" opacity=".55"/>
    <ellipse cx="158" cy="178" rx="10" ry="6" fill="#ff8fa3" opacity=".55"/>
    <path d="M106 180 Q 120 196 134 180" stroke="#141b3d" stroke-width="5" stroke-linecap="round" fill="none"/>

    <!-- arm holding a glass -->
    <path d="M50 178 C 36 182, 30 192, 32 204" stroke="#2e86c1" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M14 182 L 50 182 L 45 230 L 19 230 Z" fill="url(#glass)" stroke="#9ccfee" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M16.6 198 L 47.4 198 L 45 230 L 19 230 Z" fill="#5bb4ec" opacity=".75"/>
    <circle cx="32" cy="206" r="10" fill="#5bb4ec"/>
  </g>

  <circle class="bubble" cx="40" cy="176" r="4" fill="#7cc8f2"/>
  <circle class="bubble b2" cx="26" cy="180" r="3" fill="#7cc8f2"/>
  <circle class="bubble b3" cx="34" cy="178" r="2.5" fill="#7cc8f2"/>
</svg>
